<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <p class="eyebrow">PERSONAL ORGANIZER</p>
                <h1>TaskFlow</h1>
                <p class="subtitle">Keep track of what needs to get done.</p>
            </div>
        </header>


        <!-- Add task -->
        <section class="add-task">
            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button id="addButton" class="add-btn">
                <span class="plus-icon">+</span>
                Add task
            </button>
        </section>


        <!-- Task section -->
        <section class="task-section">

            <div class="section-header">
                <div>
                    <h2>Your tasks</h2>
                    <p id="taskCount">0 tasks</p>
                </div>
            </div>


            <!-- Empty state -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    <!-- Clipboard icon -->
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                    >
                        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                        <path d="M9 4V2.8h6V4"></path>
                        <path d="M8.5 9h7"></path>
                        <path d="M8.5 13h7"></path>
                        <path d="M8.5 17h4"></path>
                    </svg>
                </div>

                <h3>No tasks yet</h3>
                <p>Add your first task above and it'll appear here.</p>

            </div>


            <!-- Tasks will be inserted here -->
            <div id="taskList" class="task-list"></div>

        </section>

    </main>


    <!-- Delete confirmation modal -->
    <div id="deleteModal" class="modal-overlay hidden">

        <div class="modal">

            <div class="modal-icon delete-modal-icon">
                <!-- Trash icon -->
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >
                    <path d="M4 7h16"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                    <path d="M6 7l1 14h10l1-14"></path>
                    <path d="M9 7V4h6v3"></path>
                </svg>
            </div>

            <h3>Delete this task?</h3>
            <p>This action can't be undone.</p>

            <div class="modal-actions">
                <button id="cancelDelete" class="cancel-btn">
                    Cancel
                </button>

                <button id="confirmDelete" class="delete-btn">
                    Delete
                </button>
            </div>

        </div>

    </div>


    <!-- Error / notification -->
    <div id="notification" class="notification"></div>


    <script src="script.js"></script>

</body>
</html>
